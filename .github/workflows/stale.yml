name: Stale Issue Watcher

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 0 * * *'  # Uncomment to run daily at midnight UTC

permissions:
  issues: write
  contents: read

jobs:
  label-stale-issues:
    name: Label Issues Lacking Recent Activity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Ensure "Need Attention" label exists
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createLabel({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                name:        'Need Attention',
                color:       'e11d48',
                description: 'No recent activity — needs a follow-up',
              });
              console.log('Label created.');
            } catch (err) {
              if (err.status === 422) {
                console.log('Label already exists — skipping.');
              } else {
                throw err;
              }
            }

      - name: Fetch candidate issues
        id: fetch
        uses: actions/github-script@v7
        with:
          script: |
            const REPORTER_LABEL = 'Reporter/External';
            const STALE_LABEL    = 'Need Attention';

            console.log(`Fetching open issues labelled "${REPORTER_LABEL}" …`);

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              state:    'open',
              labels:   REPORTER_LABEL,
              per_page: 100,
            });

            // Explicitly exclude PRs and any issue already carrying the stale label
            const candidates = issues.filter(issue =>
              !issue.pull_request &&
              !issue.labels.some(l => l.name === STALE_LABEL)
            );

            console.log(`   Total with "${REPORTER_LABEL}"  : ${issues.length}`);
            console.log(`   Already stale (excluded)      : ${issues.length - candidates.length}`);
            console.log(`   Candidates to triage          : ${candidates.length}`);

            const slim = candidates.map(i => ({
              number:    i.number,
              title:     i.title,
              createdAt: i.created_at,
            }));

            // Write to GITHUB_OUTPUT as base64 to safely handle titles
            // with quotes, newlines, or other characters that would break
            // direct ${{ steps.fetch.outputs.x }} interpolation in scripts.
            const encoded = Buffer.from(JSON.stringify(slim)).toString('base64');
            core.setOutput('issues_b64', encoded);
            core.setOutput('count', slim.length);

      - name: Triage and label stale issues
        uses: actions/github-script@v7
        env:
          ISSUES_B64: ${{ steps.fetch.outputs.issues_b64 }}
        with:
          script: |
            const STALE_THRESHOLD_DAYS = 100;
            const STALE_THRESHOLD_MS   = STALE_THRESHOLD_DAYS * 24 * 60 * 60 * 1000;
            const STALE_LABEL          = 'Need Attention';
            const KEYWORD_TRIGGER_REGEX= /customer updated.*?(\d{4}-\d{2}-\d{2})/i;

            // Decode safely via env var — immune to quote/newline injection
            const issues = JSON.parse(
              Buffer.from(process.env.ISSUES_B64, 'base64').toString('utf8')
            );

            console.log(`Stale threshold : ${STALE_THRESHOLD_DAYS} days`);
            console.log(`Candidate issues: ${issues.length}`);
            console.log('────────────────────────────────────────');

            if (issues.length === 0) {
              console.log('Nothing to do.');
              return;
            }

            let labelled = 0;
            let skipped  = 0;
            const now    = Date.now();

            for (const issue of issues) {
              console.log(`#${issue.number}: "${issue.title}"`);

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issue.number,
                per_page:     100,
              });

              let refDate;
              let dateSource = 'issue createdAt';

              // Check for comment with exact regex (date extraction)
              const regexMatch = comments.find(c => c.body?.toLowerCase().match(KEYWORD_TRIGGER_REGEX));
              if (regexMatch) {
                const match = regexMatch.body.match(KEYWORD_TRIGGER_REGEX);
                if (match && match[1]) {
                  refDate = match[1];
                  dateSource = `regex extracted date from comment: ${refDate}`;
                  console.log(`Keyword regex matched with date — using: ${refDate}`);
                }
              }

              // If no regex match, check for simple "customer updated" comment
              if (!refDate) {
                const simpleKeywordComment = comments
                  .filter(c => c.body?.toLowerCase().includes('customer updated'))
                  .at(-1);
                
                if (simpleKeywordComment) {
                  refDate = simpleKeywordComment.created_at;
                  dateSource = 'last "customer updated" comment date';
                  console.log(`Keyword "customer updated" comment found — using: ${refDate}`);
                }
              }

              // Fall back to issue createdAt
              if (!refDate) {
                refDate = issue.createdAt;
                console.log(`No keyword comment — using issue createdAt: ${refDate}`);
              }

              const ageMs   = now - new Date(refDate).getTime();
              const daysOld = Math.floor(ageMs / (1000 * 60 * 60 * 24));

              if (ageMs > STALE_THRESHOLD_MS) {
                console.log(`${daysOld}d old → stale — applying "${STALE_LABEL}"`);
                await github.rest.issues.addLabels({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: issue.number,
                  labels:       [STALE_LABEL],
                });
                labelled++;
              } else {
                const daysLeft = STALE_THRESHOLD_DAYS - daysOld;
                console.log(`Within threshold — ${daysOld}d old (${daysLeft}d remaining) — skipping`);
                skipped++;
              }

              console.log('');
            }

            console.log('────────────────────────────────────────');
            console.log(`✔  Done.  Labelled: ${labelled}  |  Skipped: ${skipped}`);