name: Stale Issue Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  issues: write
  contents: read

jobs:
  label-stale-issues:
    name: Label Issues Lacking Recent Activity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Ensure "Need Attention" label exists
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createLabel({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                name:        'Need Attention',
                color:       'e11d48',
                description: 'No recent activity — needs a follow-up',
              });
              console.log('✅  Label created.');
            } catch (err) {
              if (err.status === 422) {
                console.log('ℹ️   Label already exists — skipping.');
              } else {
                throw err;
              }
            }

      - name: Fetch candidate issues
        id: fetch
        uses: actions/github-script@v7
        with:
          script: |
            const REPORTER_LABEL = 'Reporter/External';
            const LABEL_NAME     = 'Need Attention';

            console.log(`🔍  Fetching ALL open issues …`);

            // Fetch every open issue — no server-side label filter,
            // because the GitHub API stops paginating early when a label
            // filter is combined with pagination, causing issues to be missed.
            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              state:    'open',
              per_page: 100,
            });

            console.log(`   Total open issues fetched: ${allIssues.length}`);

            // Filter entirely in JS — PRs out, must have REPORTER_LABEL,
            // must NOT already have LABEL_NAME
            const candidates = allIssues.filter(issue =>
              !issue.pull_request &&
              issue.labels.some(l => l.name === REPORTER_LABEL) &&
              !issue.labels.some(l => l.name === LABEL_NAME)
            );

            console.log(`   Candidates (reporter, not yet stale-labelled): ${candidates.length}`);

            const slim = candidates.map(i => ({
              number:    i.number,
              title:     i.title,
              createdAt: i.created_at,
            }));

            core.setOutput('issues', JSON.stringify(slim));
            core.setOutput('count',  slim.length);

      - name: Triage and label stale issues
        uses: actions/github-script@v7
        with:
          script: |
            const STALE_THRESHOLD_DAYS = 100;
            const STALE_THRESHOLD_MS   = STALE_THRESHOLD_DAYS * 24 * 60 * 60 * 1000;
            const LABEL_NAME           = 'Need Attention';
            const KEYWORD_TRIGGER      = 'customer updated';

            const issues = JSON.parse('${{ steps.fetch.outputs.issues }}');

            console.log(`⏱  Stale threshold : ${STALE_THRESHOLD_DAYS} days`);
            console.log(`🔑  Keyword trigger : "${KEYWORD_TRIGGER}"`);
            console.log(`📋  Candidate issues: ${issues.length}`);
            console.log('────────────────────────────────────────');

            if (issues.length === 0) {
              console.log('Nothing to do.');
              return;
            }

            let labelled = 0;
            let skipped  = 0;
            const now    = Date.now();

            for (const issue of issues) {
              console.log(`🔎  #${issue.number}: "${issue.title}"`);

              // Fetch all comments for this issue (paginated)
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issue.number,
                per_page:     100,
              });

              // Find the last comment that contains the keyword
              const keywordComment = comments
                .filter(c => c.body?.toLowerCase().includes(KEYWORD_TRIGGER))
                .at(-1);

              let refDate;
              if (keywordComment) {
                refDate = keywordComment.created_at;
                console.log(`   🔑  Keyword comment found — using: ${refDate}`);
              } else {
                refDate = issue.createdAt;
                console.log(`   📅  No keyword comment — using issue createdAt: ${refDate}`);
              }

              const ageMs   = now - new Date(refDate).getTime();
              const daysOld = Math.floor(ageMs / (1000 * 60 * 60 * 24));

              if (ageMs > STALE_THRESHOLD_MS) {
                console.log(`   🏷  ${daysOld}d old → stale — applying "${LABEL_NAME}"`);
                await github.rest.issues.addLabels({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: issue.number,
                  labels:       [LABEL_NAME],
                });
                labelled++;
              } else {
                const daysLeft = STALE_THRESHOLD_DAYS - daysOld;
                console.log(`   ✅  Within threshold — ${daysOld}d old (${daysLeft}d remaining) — skipping`);
                skipped++;
              }

              console.log('');
            }

            console.log('────────────────────────────────────────');
            console.log(`✔  Done.  Labelled: ${labelled}  |  Skipped: ${skipped}`);