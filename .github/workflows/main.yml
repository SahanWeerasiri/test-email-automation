name: Stale Issue Watcher

on:
  # 1a. Manual trigger
  workflow_dispatch:

  # 1b. Every day (production schedule)
  schedule:
    - cron: '0 0 * * *'   # every 24 hours at midnight UTC

permissions:
  issues: write      # needed to add labels
  contents: read     # least-privilege baseline

jobs:
  label-stale-issues:
    name: Label Issues Lacking Recent Activity
    runs-on: ubuntu-latest
    timeout-minutes: 10   # safety cap — avoids runaway billing

    env:
      STALE_THRESHOLD_DAYS: 14
      STALE_THRESHOLD_SECONDS: 9072000 # 1209600  # 14 * 24 * 60 * 60

      LABEL_NAME: "Need Attention"
      LABEL_COLOR: "e11d48"
      LABEL_DESC: "No recent activity — needs a follow-up"

      REPORTER_LABEL: "Reporter/External"

      # ── Keyword trigger ───────────────────────────────────────────────────
      # If the last comment is within the threshold but contains this string,
      # the label is still applied.
      KEYWORD_TRIGGER: "needs review"

    steps:
      # ── 1. Harden the runner ─────────────────────────────────────────────
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      # ── 2. Ensure the label exists ────────────────────────────────────────
      - name: Ensure "Need Attention" label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "$LABEL_NAME" \
            --color "$LABEL_COLOR" \
            --description "$LABEL_DESC" \
            --repo "${{ github.repository }}" \
          || gh label edit "$LABEL_NAME" \
            --color "$LABEL_COLOR" \
            --description "$LABEL_DESC" \
            --repo "${{ github.repository }}"

      # ── 3. Fetch & triage ─────────────────────────────────────────────────
      # Criteria:
      #   - open
      #   - has label: Reporter/External
      #   - does NOT have label: Need Attention
      - name: Triage open reporter issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          NOW=$(date +%s)
          THRESHOLD=$STALE_THRESHOLD_SECONDS
          LABELLED=0
          SKIPPED=0

          echo "⏱  Stale threshold : ${STALE_THRESHOLD_DAYS} days (${THRESHOLD}s)"
          echo "🏷  Target label    : \"${REPORTER_LABEL}\""
          echo "🔍  Fetching open issues with \"${REPORTER_LABEL}\" and without \"${LABEL_NAME}\" …"
          echo "────────────────────────────────────────"

          ISSUES=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --limit 100 \
            --search "label:\"${REPORTER_LABEL}\" -label:\"${LABEL_NAME}\"" \
            --json number,title,updatedAt \
            2>/dev/null || echo "[]")

          COUNT=$(echo "$ISSUES" | jq 'length')
          echo "   Found ${COUNT} candidate issue(s)"
          echo "────────────────────────────────────────"

          [ "$COUNT" -eq 0 ] && { echo "Nothing to do."; exit 0; }

          while IFS= read -r issue; do
            NUMBER=$(echo "$issue" | jq -r '.number')
            TITLE=$(echo "$issue"  | jq -r '.title')

            echo "🔎  #${NUMBER}: \"${TITLE}\""

            # ── Fetch last comment date + body ─────────────────────────────
            COMMENT_DATA=$(gh issue view "$NUMBER" \
              --repo "$REPO" \
              --json comments \
              --jq '.comments | if length > 0 then { date: last.createdAt, body: last.body } else { date: "", body: "" } end' \
              2>/dev/null || echo '{"date":"","body":""}')

            LAST_COMMENT_DATE=$(echo "$COMMENT_DATA" | jq -r '.date')
            LAST_COMMENT_BODY=$(echo "$COMMENT_DATA" | jq -r '.body')

            # Fall back to updatedAt when there are no comments at all
            if [ -z "$LAST_COMMENT_DATE" ]; then
              LAST_COMMENT_DATE=$(echo "$issue" | jq -r '.updatedAt')
            fi

            LAST_TS=$(date -d "$LAST_COMMENT_DATE" +%s 2>/dev/null \
                      || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$LAST_COMMENT_DATE" +%s)
            AGE=$(( NOW - LAST_TS ))
            DAYS_AGO=$(( AGE / 86400 ))

            # ── Date check: last comment older than threshold? ─────────────
            if [ "$AGE" -gt "$THRESHOLD" ]; then
              echo "   🏷  Last comment ${DAYS_AGO}d ago → applying \"${LABEL_NAME}\""
              gh issue edit "$NUMBER" \
                --repo "$REPO" \
                --add-label "$LABEL_NAME"
              LABELLED=$(( LABELLED + 1 ))

            else
              echo "   ➖  No match — skipping (Last comment ${DAYS_AGO}d ago)"
              SKIPPED=$(( SKIPPED + 1 ))
            fi

            echo ""

          done < <(echo "$ISSUES" | jq -c '.[]')

          echo "────────────────────────────────────────"
          echo "✔  Done.  Labelled: ${LABELLED}  |  Skipped: ${SKIPPED}"