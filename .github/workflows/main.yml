name: Stale Issue Watcher

on:
  # 1a. Manual trigger
  workflow_dispatch:

  # 1b. Every day (production schedule)
  schedule:
    - cron: '0 0 * * *'   # every 24 hours at midnight UTC

permissions:
  issues: write      # needed to add labels
  contents: read     # least-privilege baseline

jobs:
  label-stale-issues:
    name: Label Issues Lacking Recent Activity
    runs-on: ubuntu-latest
    timeout-minutes: 10   # safety cap — avoids runaway billing

    env:
      STALE_THRESHOLD_DAYS: 14
      STALE_THRESHOLD_SECONDS: 9072000  # 14 * 24 * 60 * 60

      LABEL_NAME: "Need Attention"
      LABEL_COLOR: "e11d48"
      LABEL_DESC: "No recent activity — needs a follow-up"

      REPORTER_LABEL: "Reporter/External"

      # The last comment whose body contains this keyword is used as the
      # reference date for the staleness check.
      # If no such comment exists, the issue createdAt is used instead.
      KEYWORD_TRIGGER: "Customer Updated"

    steps:
      # ── 1. Harden the runner ─────────────────────────────────────────────
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      # ── 2. Ensure the label exists ────────────────────────────────────────
      - name: Ensure "Need Attention" label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "$LABEL_NAME" \
            --color "$LABEL_COLOR" \
            --description "$LABEL_DESC" \
            --repo "${{ github.repository }}" \
          || gh label edit "$LABEL_NAME" \
            --color "$LABEL_COLOR" \
            --description "$LABEL_DESC" \
            --repo "${{ github.repository }}"

      # ── 3. Fetch & triage ─────────────────────────────────────────────────
      # Uses `gh api --paginate` to walk all pages (100 issues per page)
      # so no issues are missed regardless of repo size.
      #
      # Filter criteria applied server-side via the search API:
      #   - open
      #   - has label: Reporter/External
      #   - does NOT have label: Need Attention
      - name: Triage open reporter issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          NOW=$(date +%s)
          THRESHOLD=$STALE_THRESHOLD_SECONDS
          LABELLED=0
          SKIPPED=0

          echo "⏱  Stale threshold : ${STALE_THRESHOLD_DAYS} days (${THRESHOLD}s)"
          echo "🔑  Keyword trigger : \"${KEYWORD_TRIGGER}\""
          echo "🏷  Target label    : \"${REPORTER_LABEL}\""
          echo "🔍  Fetching ALL open issues with \"${REPORTER_LABEL}\" and without \"${LABEL_NAME}\" …"
          echo "────────────────────────────────────────"

          # gh api --paginate automatically follows the Link: header and
          # merges all pages into a single JSON array via --jq.
          # The search API returns items[] so we flatten across pages with
          # the --jq slice.
          #
          # URL-encode the labels for the query string:
          #   label:"Reporter/External" -label:"Need Attention"
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)

          ISSUES=$(gh api \
            --paginate \
            --method GET \
            "repos/${REPO}/issues" \
            -f state=open \
            -f per_page=100 \
            -f labels="${REPORTER_LABEL}" \
            --jq "[.[] | select(
                    .pull_request == null and
                    ([.labels[].name] | contains([\"${LABEL_NAME}\"]) | not)
                  ) | { number: .number, title: .title, createdAt: .created_at }]" \
            2>/dev/null || echo "[]")

          # --paginate emits one JSON array per page; merge them all into one
          ISSUES=$(echo "$ISSUES" | jq -s 'add // []')

          COUNT=$(echo "$ISSUES" | jq 'length')
          echo "   Found ${COUNT} candidate issue(s) across all pages"
          echo "────────────────────────────────────────"

          [ "$COUNT" -eq 0 ] && { echo "Nothing to do."; exit 0; }

          while IFS= read -r issue; do
            NUMBER=$(echo "$issue" | jq -r '.number')
            TITLE=$(echo "$issue"  | jq -r '.title')
            CREATED_AT=$(echo "$issue" | jq -r '.createdAt')

            echo "🔎  #${NUMBER}: \"${TITLE}\""

            # ── Find the last comment containing the keyword ───────────────
            # Uses gh api --paginate to fetch ALL comments for the issue,
            # then picks the most recent one whose body matches the keyword.
            LOWER_KEYWORD=$(echo "$KEYWORD_TRIGGER" | tr '[:upper:]' '[:lower:]')

            ALL_COMMENTS=$(gh api \
              --paginate \
              --method GET \
              "repos/${REPO}/issues/${NUMBER}/comments" \
              -f per_page=100 \
              --jq "[.[] | { createdAt: .created_at, body: .body }]" \
              2>/dev/null || echo "[]")

            ALL_COMMENTS=$(echo "$ALL_COMMENTS" | jq -s 'add // []')

            KEYWORD_COMMENT_DATE=$(echo "$ALL_COMMENTS" | jq -r \
              --arg kw "$LOWER_KEYWORD" \
              '[.[] | select((.body // "" | ascii_downcase) | contains($kw))] | last | .createdAt // ""')

            # ── Decide which date to use for the age check ─────────────────
            if [ -n "$KEYWORD_COMMENT_DATE" ] && [ "$KEYWORD_COMMENT_DATE" != "null" ]; then
              REF_DATE="$KEYWORD_COMMENT_DATE"
              echo "   🔑  Keyword comment found — using its date: ${REF_DATE}"
            else
              REF_DATE="$CREATED_AT"
              echo "   📅  No keyword comment — falling back to issue createdAt: ${REF_DATE}"
            fi

            REF_TS=$(date -d "$REF_DATE" +%s 2>/dev/null \
                     || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$REF_DATE" +%s)
            AGE=$(( NOW - REF_TS ))
            DAYS_AGO=$(( AGE / 86400 ))

            # ── Staleness check ────────────────────────────────────────────
            if [ "$AGE" -gt "$THRESHOLD" ]; then
              echo "   🏷  ${DAYS_AGO}d ago → stale — applying \"${LABEL_NAME}\""
              gh issue edit "$NUMBER" \
                --repo "$REPO" \
                --add-label "$LABEL_NAME"
              LABELLED=$(( LABELLED + 1 ))
            else
              SECS_LEFT=$(( THRESHOLD - AGE ))
              echo "   ✅  Within threshold — ${DAYS_AGO}d ago (${SECS_LEFT}s left) — skipping"
              SKIPPED=$(( SKIPPED + 1 ))
            fi

            echo ""

          done < <(echo "$ISSUES" | jq -c '.[]')

          echo "────────────────────────────────────────"
          echo "✔  Done.  Labelled: ${LABELLED}  |  Skipped: ${SKIPPED}"