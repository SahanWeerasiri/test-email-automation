name: Stale Issue Watcher

on:
  # 1a. Manual trigger
  workflow_dispatch:

  # 1b. Every 2 weeks (production schedule)
  schedule:
    - cron: "0 0 */14 * *"   # every 14 days at midnight UTC

  # 1c. Every 10 seconds is NOT supported by GitHub's scheduler
  #     (minimum granularity is 5 minutes). For testing, use
  #     workflow_dispatch above, or push a test commit to trigger
  #     via a `push` event on a scratch branch:
  #
  # push:
  #   branches: [ "test/stale-watcher" ]
  #
  # ⚠️  If you truly need sub-minute triggers for CI/CD testing,
  #     run the script locally or via act (https://github.com/nektos/act).

permissions:
  issues: write      # needed to add labels
  contents: read     # least-privilege baseline

jobs:
  label-stale-issues:
    name: Label Issues Lacking Recent Activity
    runs-on: ubuntu-latest
    timeout-minutes: 10   # safety cap — avoids runaway billing

    env:
      # ── Thresholds ────────────────────────────────────────────────────────
      # Production: flag issues whose last comment is older than 14 days.
      # Testing   : change to 30 (seconds) and run via workflow_dispatch.
      STALE_THRESHOLD_DAYS: 14          # production value
      # STALE_THRESHOLD_DAYS: 0          # uncomment for testing (30-sec sim)
      STALE_THRESHOLD_SECONDS: 1209600  # 14 days in seconds (14*24*60*60)
      # STALE_THRESHOLD_SECONDS: 30      # uncomment for testing

      LABEL_NAME: "Need Attention"
      LABEL_COLOR: "e11d48"   # red-600 — visible but not alarming
      LABEL_DESC: "No recent activity — needs a follow-up"

    steps:
      # ── 1. Harden the runner ─────────────────────────────────────────────
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit   # switch to 'block' once you know your domains

      # ── 2. Ensure the label exists ────────────────────────────────────────
      - name: Ensure "Need Attention" label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "$LABEL_NAME" \
            --color "$LABEL_COLOR" \
            --description "$LABEL_DESC" \
            --repo "${{ github.repository }}" \
          || gh label edit "$LABEL_NAME" \
            --color "$LABEL_COLOR" \
            --description "$LABEL_DESC" \
            --repo "${{ github.repository }}"
          # 'create' fails if the label already exists; 'edit' updates it.
          # Either way we end up with the correct label. Exit code is 0.

      # ── 3. Fetch all open issues and triage them ──────────────────────────
      - name: Triage open issues for stale activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          NOW=$(date +%s)
          THRESHOLD=$STALE_THRESHOLD_SECONDS
          LABELLED=0
          SKIPPED=0
          PAGE=1

          echo "⏱  Stale threshold: ${STALE_THRESHOLD_DAYS} days (${THRESHOLD}s)"
          echo "🔍  Scanning open issues in ${REPO} …"
          echo "────────────────────────────────────────"

          while true; do
            # Fetch a page of open issues (not pull requests)
            ISSUES=$(gh issue list \
              --repo "$REPO" \
              --state open \
              --limit 100 \
              --json number,title,labels,updatedAt,comments \
              --jq '[.[] | select(.comments != null)]' \
              2>/dev/null || echo "[]")

            # Break if no more issues
            COUNT=$(echo "$ISSUES" | jq 'length')
            [ "$COUNT" -eq 0 ] && break

            while IFS= read -r issue; do
              NUMBER=$(echo "$issue" | jq -r '.number')
              TITLE=$(echo "$issue"  | jq -r '.title')

              # ── Find the date of the last comment ─────────────────────────
              # gh issue list doesn't return comment dates; fetch them per issue.
              LAST_COMMENT_DATE=$(gh issue view "$NUMBER" \
                --repo "$REPO" \
                --json comments \
                --jq '.comments | if length > 0 then last.createdAt else "" end' \
                2>/dev/null || echo "")

              # Fall back to issue updatedAt if there are no comments
              if [ -z "$LAST_COMMENT_DATE" ]; then
                LAST_COMMENT_DATE=$(echo "$issue" | jq -r '.updatedAt')
              fi

              LAST_TS=$(date -d "$LAST_COMMENT_DATE" +%s 2>/dev/null \
                        || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$LAST_COMMENT_DATE" +%s)
              AGE=$(( NOW - LAST_TS ))

              # ── Already labelled? Skip to avoid duplicate API calls ────────
              ALREADY=$(echo "$issue" | jq -r \
                --arg lbl "$LABEL_NAME" \
                '.labels | map(select(.name == $lbl)) | length')

              if [ "$ALREADY" -gt 0 ]; then
                echo "⏭  #${NUMBER} already labelled — skipping"
                SKIPPED=$(( SKIPPED + 1 ))
                continue
              fi

              # ── Apply label if stale ──────────────────────────────────────
              if [ "$AGE" -gt "$THRESHOLD" ]; then
                DAYS_AGO=$(( AGE / 86400 ))
                echo "🏷  #${NUMBER} — last activity ${DAYS_AGO}d ago → adding \"${LABEL_NAME}\""
                echo "   Title: ${TITLE}"
                gh issue edit "$NUMBER" \
                  --repo "$REPO" \
                  --add-label "$LABEL_NAME"
                LABELLED=$(( LABELLED + 1 ))
              else
                SECS_LEFT=$(( THRESHOLD - AGE ))
                echo "✅  #${NUMBER} — active within threshold (${SECS_LEFT}s remaining)"
                SKIPPED=$(( SKIPPED + 1 ))
              fi

            done < <(echo "$ISSUES" | jq -c '.[]')

            # gh issue list doesn't paginate via --page; 100 is the hard max.
            # If you have >100 open issues, swap in the REST API below.
            break
          done

          echo "────────────────────────────────────────"
          echo "✔  Done. Labelled: ${LABELLED}  |  Skipped: ${SKIPPED}"